*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
a{color:var(--info)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.page{max-width:1440px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.glass{border:1px solid var(--bd);border-radius:14px;background:var(--glass)}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:10px 16px}
.brand{font-size:15px;font-weight:600}
.spacer{flex:1 1 auto}
.note{color:var(--muted);font-size:12px}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;border-radius:12px;background:var(--strong)}
.seg button{appearance:none;border:0;background:transparent;color:var(--muted);font:inherit;padding:7px 14px;min-height:34px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff;font-weight:600}
.btn{appearance:none;border:1px solid var(--bd2);background:var(--strong);color:var(--text);border-radius:10px;padding:0 14px;min-height:36px;font:inherit;cursor:pointer}
.btn:hover{border-color:var(--accent)}.btn.primary{background:var(--accent);border-color:var(--accent)}
.btn[disabled]{opacity:.5;cursor:default}.btn.on{border-color:var(--accent);background:rgba(59,130,246,.18)}
.pick{appearance:none;text-align:left;font:inherit;color:inherit;cursor:pointer;padding:10px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--strong)}
.pick.on{border-color:var(--accent);background:rgba(59,130,246,.14)}
.pill{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid transparent;white-space:nowrap}
.p-warn{background:rgba(245,158,11,.12);color:var(--warn);border-color:rgba(245,158,11,.32)}
.p-ok{background:rgba(38,214,154,.14);color:var(--ok);border-color:rgba(38,214,154,.3)}
.p-info{background:rgba(59,130,246,.15);color:var(--info);border-color:rgba(59,130,246,.3)}
.p-bad{background:rgba(239,68,68,.15);color:var(--bad);border-color:rgba(239,68,68,.3)}

.p-violet{background:rgba(167,139,250,.15);color:#c4b5fd;border-color:rgba(167,139,250,.35)}
.p-teal{background:rgba(45,212,191,.12);color:#5eead4;border-color:rgba(45,212,191,.32)}
.p-gray{background:rgba(148,163,184,.13);color:#94a3b8}
.banner{padding:10px 12px;border-radius:10px;border:1px solid}
.b-warn{background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.32);color:var(--warn)}
.b-ok{background:rgba(38,214,154,.10);border-color:rgba(38,214,154,.3);color:var(--ok)}
.b-info{background:rgba(59,130,246,.10);border-color:rgba(59,130,246,.3);color:var(--info)}

.b-bad{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.3);color:var(--bad)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.col{display:flex;flex-direction:column;gap:8px}
.split{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}

.main{flex:999 1 560px;min-width:0;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.card{padding:12px;border-radius:12px;border:1px solid var(--bd);display:flex;flex-direction:column;gap:6px}
.card.on{border-color:var(--accent);background:rgba(59,130,246,.12)}

.stats .k{color:var(--muted);font-size:11px}

.bar div{height:100%;border-right:1px solid rgba(5,13,24,.6)}
.bar div.cut{border-right:3px solid var(--text)}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none}
.group{border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.ghead{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--strong)}
.item{border-top:1px solid rgba(141,203,255,.1)}
.item>button{appearance:none;width:100%;border:0;background:transparent;color:inherit;font:inherit;text-align:left;cursor:pointer;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 12px}
.item>button:hover{background:rgba(59,130,246,.06)}
.src{color:var(--muted);font-size:12px;flex:1 1 200px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.num{color:var(--t2);width:64px;text-align:right}
.detail{padding:0 12px 12px 34px;display:flex;flex-direction:column;gap:8px}
pre{margin:0;padding:10px 12px;border-radius:10px;background:var(--surface);color:var(--t2);font:12px/1.6 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap}
.field{border:1px solid var(--bd2);background:var(--surface);color:var(--text);border-radius:10px;padding:8px 10px;font:inherit;min-height:36px;width:100%}
textarea.field{resize:vertical}
label.lbl{display:flex;flex-direction:column;gap:6px}
label.lbl>span{color:var(--muted);font-size:12px}
.chip{appearance:none;font:inherit;cursor:pointer;padding:6px 12px;min-height:34px;border-radius:999px;border:1px solid var(--bd2);background:transparent;color:var(--muted)}
.chip.on{border-color:var(--accent);background:rgba(59,130,246,.15);color:#bfdbfe}
.act{appearance:none;font:inherit;color:inherit;cursor:pointer;text-align:left;padding:8px 12px;border-radius:10px;border:1px solid var(--bd);background:transparent}
.tablebox{overflow-x:auto;border:1px solid var(--bd);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:900px}
th,td{padding:8px}
thead tr{background:var(--strong)}
th{color:var(--muted);font-weight:500}
tbody tr{border-top:1px solid rgba(141,203,255,.1)}
.cell{appearance:none;font:inherit;cursor:pointer;width:76px;min-height:36px;border-radius:8px;border:1px dashed rgba(141,203,255,.2);background:transparent;color:var(--t3)}

.empty{padding:28px;border-radius:12px;border:1px dashed var(--bd2);color:var(--t2);display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.vh{position:absolute;left:-9999px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--t2)}
.legend span{display:inline-flex;align-items:center;gap:6px}

    '<button class="btn" data-act="screen" data-arg="preview">在注入预览里看效果</button>' + (it.ro ? '' : '<button class="btn primary" data-act="psave"' + (pCheck(it, txt).some(function (c) { return c[0] === 'bad'; }) || !dirty ? ' disabled' : '') + '>保存</button>') + '</div>';
  h += '<div class="stats" style="gap:24px"><div><div class="k">默认文件</div><div class="mono">' + (it.ro ? esc(it.file) : 'prompts/' + esc(it.file)) + '</div></div>' +
    (it.ro ? '' : '<div><div class="k">覆盖文件（本机，不进 git）</div><div class="mono">' + (st === 'default' ? '（无）' : 'prompts.local/' + esc(it.file)) + '</div></div>') +
    '<div><div class="k">用于</div><div>' + esc(it.used) + '</div></div>' + (it.when ? '<div><div class="k">生效条件（引擎定义，只读）</div><div>' + esc(it.when) + '</div></div>' : '') + '</div>';
  if (it.ro) h += '<div class="banner b-info">只读：这份文件在项目仓库 req-board 的主干里。第一期请用编辑器修改并提交到该仓库；这里显示的是下次编译会读到的内容。</div>';
  if (st === 'stale') {
    h += '<div class="banner b-warn">升级后默认版本已更新（' + it.base + ' → ' + it.newBase + '），你的覆盖基于旧版默认。编译仍使用你的覆盖，直到你处理。 <button class="btn" data-act="p3" style="margin-left:8px">' + (p.three ? '收起三方对比' : '三方对比') + '</button></div>';
    if (p.three) {
      var col = function (title, t) { return '<div class="col" style="flex:1 1 240px;min-width:0;gap:6px"><b>' + title + '</b><pre>' + esc(t) + '</pre></div>'; };
      h += '<div class="row" style="align-items:stretch;gap:10px">' + col('旧默认 ' + it.base, it.old) + col('新默认 ' + it.newBase, it.text) + col('你的覆盖', pSaved(it)) + '</div>' +
        '<div class="row"><button class="btn" data-act="ptake" data-arg="new">采用新默认</button><button class="btn" data-act="ptake" data-arg="merge">在新默认上重放我的修改</button><button class="btn" data-act="ptake" data-arg="mine">保留我的覆盖并标记已处理</button></div>';
    }
  } else if (st === 'override') {
    h += '<div class="banner b-info">你的覆盖版本 · 基于默认 ' + it.base + '。编译时使用覆盖，清单里记为「覆盖」。</div>';
  }
  if (p.diff && !it.ro) {
    h += '<div class="col" style="gap:4px"><span class="note">与默认相比（- 默认里有、你删掉的；+ 你新增或改写的）</span><pre>' + lineDiff(it.text, txt).map(function (d) {
      var c = d[0] === '+' ? 'color:var(--ok)' : d[0] === '-' ? 'color:var(--bad)' : '';
      return '<span style="' + c + '">' + d[0] + ' ' + esc(d[1]) + '</span>';
    }).join('\n') + '</pre></div>';
  } else if (it.ro) {
    h += '<pre>' + esc(txt) + '</pre>';
  } else {
    if (it.ph.length) h += '<div class="row"><span class="note">可用占位符（点击插入到光标处）：</span>' + it.ph.map(function (x) { return '<button class="chip mono" data-act="pins" data-arg="' + x[0] + '">{' + x[0] + '}' + (x[1] ? ' · 必需' : '') + '</button>'; }).join('') + '</div>';
    if (it.locked.length) h += '<div class="col" style="gap:4px"><span class="note">契约句（调度器按它解析结果，锁定不可删改）</span><pre style="border:1px dashed rgba(245,158,11,.4)">' + it.locked.map(function (l) { return '🔒 ' + esc(l); }).join('\n') + '</pre></div>';
    h += '<label class="lbl"><span>可编辑正文</span><textarea id="pEdit" class="field mono" rows="10" style="line-height:1.6">' + esc(txt) + '</textarea></label>';
  }
  h += '<div class="col" style="gap:6px"><b>校验</b>' + pCheck(it, txt).map(function (c) {
    return '<span style="color:' + (c[0] === 'ok' ? 'var(--ok)' : c[0] === 'bad' ? 'var(--bad)' : 'var(--warn)') + '">' + (c[0] === 'ok' ? '✓' : c[0] === 'bad' ? '✕' : '!') + ' ' + esc(c[1]) + '</span>';
  }).join('') + '<span class="note">试一下：在正文里打一个 {timeout}，保存按钮会变灰。</span></div>';
  return h + '</div></div></section>';
}
var P_ACTIONS = {
  settab: function (a) { state.st = a; history.replaceState(null, '', '#' + (a === 'prompts' ? 'prompts' : 'skills')); },
  psel: function (a) { state.pp.sel = a; state.pp.diff = false; state.pp.three = false; },
  pdiff: function () { state.pp.diff = !state.pp.diff; },
  p3: function () { state.pp.three = !state.pp.three; },
  psave: function () { var it = P_ITEMS[state.pp.sel]; state.pp.saved[it.id] = pCurrent(it); delete state.pp.draft[it.id]; if (pStatus(it) !== 'stale') state.pp.status[it.id] = 'override'; },
  prestore: function () { var it = P_ITEMS[state.pp.sel]; delete state.pp.draft[it.id]; delete state.pp.saved[it.id]; state.pp.status[it.id] = 'default'; state.pp.three = false; },
  ptake: function (a) {
    var it = P_ITEMS[state.pp.sel];
    if (a === 'new') { delete state.pp.saved[it.id]; delete state.pp.draft[it.id]; state.pp.status[it.id] = 'default'; }
    else if (a === 'merge') { state.pp.saved[it.id] = it.text.replace('1. 改动严格限于本需求与输入方案划定的范围……', '1. 改动严格限于本需求与输入方案划定的范围；遇到需要改公共组件时先报 need_confirm。'); state.pp.status[it.id] = 'override'; }
    else { state.pp.status[it.id] = 'override'; }
    state.pp.three = false;
  },
  pins: function (a) {
    var it = P_ITEMS[state.pp.sel], el = document.getElementById('pEdit');
    var txt = pCurrent(it), pos = el ? el.selectionStart : txt.length;
    state.pp.draft[it.id] = txt.slice(0, pos) + '{' + a + '}' + txt.slice(pos);
  }
};

/* ---------------- 路由与事件 ---------------- */
var SCREENS = [['context', '① 卡片上下文'], ['skills', '② 设置：提示词 / 技能库'], ['preview', '③ 注入预览']];
var app = document.getElementById('app');
function render() {
  document.getElementById('screens').innerHTML = SCREENS.map(function (x) { return '<button class="' + (state.screen === x[0] ? 'on' : '') + '" data-act="screen" data-arg="' + x[0] + '">' + x[1] + '</button>'; }).join('');
  app.innerHTML = state.screen === 'skills' ? (state.st === 'prompts' ? renderPrompts() : renderSkills()) : state.screen === 'preview' ? renderPreview() : renderContext();
}
var ACTIONS = {
  screen: function (a) { state.screen = a; history.replaceState(null, '', '#' + (a === 'skills' ? (state.st === 'prompts' ? 'prompts' : 'skills') : a)); window.scrollTo(0, 0); },
  goPreview131: function () { state.pv.card = '131'; state.pv.role = 'dev'; ACTIONS.screen('preview'); },
  node: function (a) { var r = RUNS[a] || []; state.ctx.node = a; state.ctx.run = r[0] ? r[0].id : null; state.ctx.open = null; state.ctx.full = false; },
  run: function (a) { state.ctx.run = Number(a); state.ctx.open = null; state.ctx.full = false; },
  open: function (a) { state.ctx.open = state.ctx.open === a ? null : a; },
  diff: function () { state.ctx.diff = !state.ctx.diff; },
  full: function () { state.ctx.full = !state.ctx.full; },
  scope: function (a) { state.sk.scope = a; },
  view: function (a) { state.sk.view = a; },
  sel: function (a) { state.sk.sel = a; },
  setAct: function (a) { var p = a.split('|'); state.sk.act[p[0]] = p[1]; },
  role: function (a) {
    var p = a.split('|'), k = SKILLS.filter(function (x) { return x.name === p[0]; })[0];
    var cur = state.sk.roles[p[0]] || k.roles;
    state.sk.roles[p[0]] = cur.indexOf(p[1]) >= 0 ? cur.filter(function (x) { return x !== p[1]; }) : cur.concat([p[1]]);
  },
  cell: function (a) {
    var p = a.split('|'), CY = ['', 'always', 'auto', 'on_demand', 'manual'];
    var row = state.sk.matrix[p[0]] || (state.sk.matrix[p[0]] = {});
    var nx = CY[(CY.indexOf(row[p[1]] || '') + 1) % CY.length];
    if (nx) row[p[1]] = nx; else delete row[p[1]];
  },
  pvProject: function (a) { state.pv.project = a; },
  pvCard: function (a) { state.pv.card = a; }
};
for (var pk in P_ACTIONS) ACTIONS[pk] = P_ACTIONS[pk];
document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-act]');
  if (!t || t.disabled) return;
  e.preventDefault();
  ACTIONS[t.getAttribute('data-act')](t.getAttribute('data-arg'));
  render();
});
document.addEventListener('input', function (e) {
  if (e.target.id === 'pEdit') {
    var ps = e.target.selectionStart, pe = e.target.selectionEnd, it = P_ITEMS[state.pp.sel];
    state.pp.draft[it.id] = e.target.value; render();
    var te = document.getElementById('pEdit'); if (te) { te.focus(); te.setSelectionRange(ps, pe); }
    return;
  }
  if (e.target.id === 'skq') {
    var pos = e.target.selectionStart;
    state.sk.q = e.target.value; render();
    var el = document.getElementById('skq'); el.focus(); el.setSelectionRange(pos, pos);
  }
});
document.addEventListener('change', function (e) {
  if (e.target.id === 'pvRole') { state.pv.role = e.target.value; render(); }
  if (e.target.id === 'pvDraft') { state.pv.draft = e.target.checked; render(); }
});
window.addEventListener('hashchange', function () { var h = location.hash.slice(1); if (h === 'prompts') { state.screen = 'skills'; state.st = 'prompts'; render(); } else if (['context', 'skills', 'preview'].indexOf(h) >= 0) { state.screen = h; if (h === 'skills') state.st = 'skills'; render(); } });
render();
})();
</script>
</body>
</html>
