name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Python syntax (py_compile)
        run: git ls-files -z '*.py' | xargs -0 python -m py_compile
      - name: JavaScript syntax (node --check)
        run: for f in static/*.js; do node --check "$f"; done
      - name: Shell syntax (bash -n)
        run: for f in start.sh scripts/*.sh; do bash -n "$f"; done
      - name: JSON config parses
        run: python -m json.tool flows.json > /dev/null && python -m json.tool projects.example.json > /dev/null

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      # 部分测试用 node 跑前端 JS 片段
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      # git 提交类测试需要身份；用无害的占位身份
      - name: Configure git identity
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
      - name: Run tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q -p no:cacheprovider tests

  runtime-cert:
    name: Runtime certification (OpenCode)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          npm install -g opencode-ai@1.19.5
      - name: Certify OpenCode against the scripted fake model
        run: python -m pytest -q -p no:cacheprovider tests/test_runtime_certification.py

  english-ui:
    name: English UI has no Chinese (browser)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      # 种子测试实例（假数据、隔离目录）+ 真实 Chrome，以英文逐个进入主要视图检查可见中文
      - name: Start seeded test instance
        run: |
          REQ_BOARD_PYTHON=python scripts/test_instance.sh start 8931 --seed > /tmp/instance.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:8931/ && exit 0; sleep 1; done
          cat /tmp/instance.log; exit 1
      - name: Check English UI
        env:
          VISUAL_GATE_START_TIMEOUT: "60"
        run: python scripts/i18n_browser_check.py --url http://127.0.0.1:8931/
      - name: Stop test instance
        if: always()
        run: scripts/test_instance.sh stop 8931 || true
