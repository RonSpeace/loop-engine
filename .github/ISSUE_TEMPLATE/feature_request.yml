name: Feature request / 功能建议
description: Suggest an idea or improvement. 提出新功能或改进建议。
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Chinese or English are both fine. 中英文均可。
        For open-ended questions or ideas still taking shape, Discussions may be a better place. 想法尚未成形时，可先到 Discussions 讨论。
  - type: textarea
    id: problem
    attributes:
      label: Problem / 要解决的问题
      description: What are you trying to do, and what gets in the way today? 想做什么、目前卡在哪里。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal / 建议方案
      description: What should Loop Engine do? Which part (board, dispatcher, flows, prompts, runtimes)? 希望的行为及涉及的模块。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered / 考虑过的替代方案
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution / 参与
      options:
        - label: I'd like to work on this (please agree on the approach in this issue first). / 我愿意提交实现（请先在 issue 中对齐方案）。
